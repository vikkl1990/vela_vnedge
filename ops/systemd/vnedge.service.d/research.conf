# The OCI ubuntu account is UID 1001. Adjust both occurrences for a different host.
# ProtectHome hides /run/user; expose only the socket used by the existing capped
# research launcher at a separate mount point. Home directories remain hidden.
[Unit]
Wants=user@1001.service
After=user@1001.service

[Service]
RuntimeDirectory=vnedge-research
RuntimeDirectoryMode=0700
BindReadOnlyPaths=/run/user/1001/bus:/run/vnedge-research/bus
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/vnedge-research/bus
