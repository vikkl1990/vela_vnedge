# Decision 166: eight Pine workers instead of the six the memory budget derives (60% of MemoryMax at 1 GB each).
# The service ran at 3.9 GB of its 8 GB soft limit with six, on eight mostly idle cores; the extra two shorten the
# wave of shadow scans at each bar close that the account's mirrored entries wait for (decision 165).
[Service]
Environment=VNEDGE_WORKERS=8
