  <text x="715" y="432" text-anchor="middle" fill="#c9d1e3" font-size="11">diagnose: 20 variants per cell on the same signals (costs, stops, exits,</text>
  <text x="715" y="448" text-anchor="middle" fill="#c9d1e3" font-size="11">entries, gates, inverted) · walk-forward · agreement test · stop sweep</text>
  <text x="715" y="466" text-anchor="middle" fill="#c9d1e3" font-size="11">config fingerprint on every trade · "under current settings" book</text>
  <text x="715" y="486" text-anchor="middle" fill="#a7f3d0" font-size="10">decisions 66–100: every rule measured before adopted, or declined</text>

  <rect x="516" y="520" width="398" height="96" rx="8" fill="#1f6f43" stroke="#4ade80"/>
