  <text x="349" y="178" text-anchor="middle" fill="#c9d1e3" font-size="11">alert() · conditions · shapes</text>
  <text x="349" y="194" text-anchor="middle" fill="#c9d1e3" font-size="11">labels · strategy fills → events</text>
  <text x="349" y="214" text-anchor="middle" fill="#a7f3d0" font-size="10">funnel on every run · repaint check</text>
  <text x="349" y="230" text-anchor="middle" fill="#a7f3d0" font-size="10">(replaces REST webhooks / JSON)</text>

  <rect x="44" y="272" width="190" height="112" rx="8" fill="#6b4a12" stroke="#fbbf24"/>
  <text x="139" y="296" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">DELTA INDIA WEBSOCKET</text>
  <text x="139" y="314" text-anchor="middle" fill="#c9d1e3" font-size="11">candles 1m–1d · trades (tape)</text>
  <text x="139" y="330" text-anchor="middle" fill="#c9d1e3" font-size="11">mark · funding · top of book</text>
  <text x="139" y="352" text-anchor="middle" fill="#fde68a" font-size="10">L2 depth: not subscribed (partial)</text>
  <text x="139" y="366" text-anchor="middle" fill="#fde68a" font-size="10">book cost from the daily gate probe</text>

  <rect x="256" y="272" width="186" height="112" rx="8" fill="#1f3a6b" stroke="#60a5fa"/>
  <text x="349" y="296" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">IN-PROCESS QUEUE</text>
  <text x="349" y="314" text-anchor="middle" fill="#c9d1e3" font-size="11">CandleStore + worker pool</text>
  <text x="349" y="330" text-anchor="middle" fill="#c9d1e3" font-size="11">live before background · deadlines</text>
  <text x="349" y="352" text-anchor="middle" fill="#9fc0ff" font-size="10">SQLite, one process, one account</text>
  <text x="349" y="366" text-anchor="middle" fill="#9fc0ff" font-size="10">(no Kafka/Redis: not needed)</text>

  <rect x="44" y="402" width="398" height="104" rx="8" fill="#1f6f43" stroke="#4ade80"/>
  <text x="243" y="426" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">FEATURES AT ENTRY  +  MARKET CONTEXT (hourly)</text>
  <text x="243" y="444" text-anchor="middle" fill="#c9d1e3" font-size="11">ATR% · position in range · hour · day · efficiency · stop/ATR · score</text>
  <text x="243" y="462" text-anchor="middle" fill="#c9d1e3" font-size="11">Delta OI &amp; funding · Hyperliquid OI/premium · our smart-money cohort</text>
  <text x="243" y="480" text-anchor="middle" fill="#c9d1e3" font-size="11">Binance top-trader ratios · BTC/ETH bias 4h/1d · session</text>
  <text x="243" y="498" text-anchor="middle" fill="#a7f3d0" font-size="10">decision 101 · public data, no vendor · stored 120 days</text>

  <rect x="44" y="524" width="398" height="92" rx="8" fill="#1f6f43" stroke="#4ade80"/>
  <text x="243" y="548" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">MARKET GATE (daily)</text>
  <text x="243" y="566" text-anchor="middle" fill="#c9d1e3" font-size="11">book cost ≤ 0.25% round trip · turnover ≥ $0.25M · ATR ≥ 0.3%</text>
  <text x="243" y="584" text-anchor="middle" fill="#c9d1e3" font-size="11">not paying recently → out · fail-closed when inputs are missing</text>
  <text x="243" y="602" text-anchor="middle" fill="#a7f3d0" font-size="10">16 of 25 markets allowed today</text>

