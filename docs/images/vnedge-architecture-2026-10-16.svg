  <text x="516" y="118" fill="#86efac" font-size="15" font-weight="700">ZONE 2 · DECISION CORE (EVIDENCE, NOT A SCORE)</text>

  <rect x="516" y="136" width="398" height="110" rx="8" fill="#1f6f43" stroke="#4ade80"/>
  <text x="715" y="160" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">THE INCUBATOR: SCREEN → SHADOW → PROMOTE</text>
  <text x="715" y="178" text-anchor="middle" fill="#c9d1e3" font-size="11">nightly screen on a 30% holdout · entry-density rule · repaint test</text>
  <text x="715" y="196" text-anchor="middle" fill="#c9d1e3" font-size="11">shadow book on live data, quoted and charged like the account</text>
  <text x="715" y="214" text-anchor="middle" fill="#c9d1e3" font-size="11">30 trades / 14 days / PF 1.2 / positive weeks → proposal · delivery retirement</text>
  <text x="715" y="234" text-anchor="middle" fill="#a7f3d0" font-size="10">a cell earns its slot; nothing is enabled by hand</text>

  <rect x="516" y="262" width="190" height="110" rx="8" fill="#6b4a12" stroke="#fbbf24"/>
  <text x="611" y="286" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">LEARNED WIN MODEL</text>
  <text x="611" y="304" text-anchor="middle" fill="#c9d1e3" font-size="11">per-scanner, retrains on new trades</text>
  <text x="611" y="320" text-anchor="middle" fill="#c9d1e3" font-size="11">35,810 samples · holdout AUC 0.57</text>
  <text x="611" y="340" text-anchor="middle" fill="#fde68a" font-size="10">advisory only (decision 37):</text>
  <text x="611" y="354" text-anchor="middle" fill="#fde68a" font-size="10">a coin flip does not gate money</text>

  <rect x="724" y="262" width="190" height="110" rx="8" fill="#1f3a6b" stroke="#60a5fa"/>
  <text x="819" y="286" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">REGIME, BY RULE</text>
  <text x="819" y="304" text-anchor="middle" fill="#c9d1e3" font-size="11">efficiency ratio ≥ 0.25 · ATR floor</text>
  <text x="819" y="320" text-anchor="middle" fill="#c9d1e3" font-size="11">no weekend · higher-frame trend gate</text>
  <text x="819" y="340" text-anchor="middle" fill="#9fc0ff" font-size="10">measured: the one filter that helps</text>
  <text x="819" y="354" text-anchor="middle" fill="#9fc0ff" font-size="10">most cells (decision 96) · no LLM agent</text>

  <rect x="516" y="390" width="398" height="112" rx="8" fill="#1f6f43" stroke="#4ade80"/>
