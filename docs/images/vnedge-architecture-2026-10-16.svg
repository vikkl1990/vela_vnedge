  <text x="715" y="562" text-anchor="middle" fill="#c9d1e3" font-size="11">model retrains · screen promise vs shadow delivery retires pairs</text>
  <text x="715" y="580" text-anchor="middle" fill="#c9d1e3" font-size="11">live pairs demoted on their last 50 trades · fleet cap 40 cells</text>
  <text x="715" y="600" text-anchor="middle" fill="#a7f3d0" font-size="10">the loop the reference draws, with the numbers in the decisions log</text>

  <rect x="516" y="634" width="398" height="100" rx="8" fill="#6b1f1f" stroke="#f87171"/>
