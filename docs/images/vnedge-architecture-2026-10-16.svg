  <text x="139" y="178" text-anchor="middle" fill="#c9d1e3" font-size="11">run IN the bot (PineTS)</text>
  <text x="139" y="194" text-anchor="middle" fill="#c9d1e3" font-size="11">LuxAlgo · WillyAlgo · AlgoAlpha</text>
  <text x="139" y="210" text-anchor="middle" fill="#c9d1e3" font-size="11">BigBeluga · Zeiierman</text>
  <text x="139" y="230" text-anchor="middle" fill="#9fc0ff" font-size="10">no TradingView webhooks: same</text>
  <text x="139" y="244" text-anchor="middle" fill="#9fc0ff" font-size="10">script, backtestable, no latency</text>

  <rect x="256" y="136" width="186" height="118" rx="8" fill="#1f6f43" stroke="#4ade80"/>
